<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zyvor Device Agent hero card</title>
<!--
  1200x630 dark hero card: README hero and GitHub social preview.
  Build: ./docs/social/build-hero-dark.sh  ->  device-agent-hero-dark.jpg (2400x1260)
-->
<style>
  :root { --blue:#0071e3; --signal:#2997ff; --cyan:#64d2ff; --green:#30d158; --amber:#ff9f0a; --red:#ff453a; --violet:#bf5af2;
    --sans:'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif; --mono:'SF Mono',Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { width:1200px; height:630px; overflow:hidden; color:#f5f5f7; font-family:var(--sans); position:relative; background:#000; }
  .aurora { position:absolute; inset:0;
    background:radial-gradient(720px 460px at 80% 16%, rgba(41,151,255,.34), transparent 62%),
               radial-gradient(600px 420px at 104% 98%, rgba(100,210,255,.16), transparent 60%),
               radial-gradient(520px 380px at 6% 110%, rgba(0,113,227,.28), transparent 60%); }
  .copy { position:absolute; left:60px; top:52px; width:560px; z-index:3; }
  .brand { display:flex; align-items:center; gap:12px; font-family:var(--mono); font-size:14px; letter-spacing:.18em; text-transform:uppercase; color:#a1a1a6; }
  .brand b { color:#fff; }
  .word { margin:20px 0 0; font-size:64px; line-height:.95; font-weight:800; letter-spacing:-.05em; white-space:nowrap;
    background:linear-gradient(92deg,#fff 0%,#e3f0ff 38%,var(--signal) 74%,var(--cyan) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:6px; }
  .tag { margin:14px 0 0; font-size:31px; line-height:1.15; font-weight:700; letter-spacing:-.02em; }
  .tag em { font-style:normal; color:var(--signal); }
  .lede { margin:12px 0 0; font-size:18px; line-height:1.45; color:#b8b8bf; width:520px; text-shadow:0 1px 12px #000; }
  .stats { margin-top:24px; display:flex; gap:32px; }
  .stat b { display:block; font-size:34px; font-weight:800; letter-spacing:-.03em; color:#fff; }
  .stat span { font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#8e8e93; }
  .pill { position:absolute; left:60px; bottom:40px; display:flex; gap:10px; z-index:3; }
  .pill span { font-family:var(--mono); font-size:13.5px; font-weight:700; padding:7px 13px; border-radius:18px; border:1.5px solid rgba(255,255,255,.2); color:#e5e5ea; background:rgba(0,0,0,.6); }
  .pill span.b { background:var(--blue); border-color:var(--blue); color:#fff; box-shadow:0 0 24px rgba(0,113,227,.55); }
  .art { position:absolute; left:520px; top:0; width:680px; height:630px; z-index:2; }
  .art svg { display:block; }
  #labels { position:absolute; inset:0; z-index:4; pointer-events:none; }
  .lbl { position:absolute; font-family:var(--mono); font-size:12.5px; color:#a1a1a6; text-align:center; transform:translate(-50%,-50%); white-space:nowrap; }
  .lbl b { display:block; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:#e5e5ea; }
  .lbl span { display:block; margin-top:3px; }
  .lbl.box { padding:7px 12px; border-radius:12px; background:rgba(8,10,14,.85); border:1px solid rgba(255,255,255,.14); }
  .lbl.chip { padding:6px 11px; border-radius:13px; font-size:12.5px; font-weight:700; color:#cfe6ff; background:rgba(10,20,35,.85); border:1px solid rgba(41,151,255,.5); box-shadow:0 0 16px rgba(41,151,255,.2); }
  .lbl.left { transform:translate(0,-50%); text-align:left; }
  .lbl.right { transform:translate(-100%,-50%); text-align:right; }
  .ok { color:var(--green) !important; } .warn { color:var(--amber) !important; } .bad { color:var(--red) !important; } .sig { color:var(--signal) !important; } .cy { color:var(--cyan) !important; } .vi { color:var(--violet) !important; }
</style>
</head>
<body>
<div class="aurora"></div>
<div class="art"><svg id="art" width="680" height="630" viewBox="0 0 680 630" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="labels"></div>
<div class="copy">
  <div class="brand"><svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><defs><linearGradient id="zb" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff5a15"/><stop offset="1" stop-color="#cc420a"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#zb)"/><path d="M18.5,20.5 45.5,20.5 18.5,43.5 45.5,43.5" fill="none" stroke="#fff" stroke-width="8.3" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Zyvor</b><span>&middot;</span><span>Linux edge hardware agent</span></div>
  <div class="word">Zyvor Device Agent</div>
  <div class="tag">Discover the box.<br><em>Report what is real.</em></div>
  <div class="lede">Small Rust agent for Linux edge gateways: hardware inventory, health and bus discovery, published to Nodra and Fleet.</div>
  <div class="stats"><div class="stat"><b>3</b><span>auth modes</span></div><div class="stat"><b>2</b><span>CPU arches</span></div><div class="stat"><b>0</b><span>cloud required</span></div></div>
</div>
<div class="pill"><span class="b">github.com/zyvorai/zyvor-device-agent</span><span>Apache-2.0</span></div>
<script>
var Z = (function () {
  var NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('art'), labels = document.getElementById('labels');
  var seed = 20261004;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  function el(tag, a, parent) { var n = document.createElementNS(NS, tag); for (var k in a) n.setAttribute(k, a[k]); (parent || svg).appendChild(n); return n; }
  function g(attrs) { return el('g', attrs || {}); }
  function label(x, y, inner, cls, style) { var d = document.createElement('div'); d.className = 'lbl ' + (cls || ''); d.style.left = (520 + x) + 'px'; d.style.top = y + 'px'; if (style) d.setAttribute('style', d.getAttribute('style') + ';' + style); d.innerHTML = inner; labels.appendChild(d); return d; }
  return { NS: NS, svg: svg, W: 680, H: 630, rnd: rnd, el: el, g: g, label: label,
    reseed: function (s) { seed = s; },
    c: { blue: '#0071e3', signal: '#2997ff', cyan: '#64d2ff', green: '#30d158', amber: '#ff9f0a', red: '#ff453a', violet: '#bf5af2', teal: '#40c8e0', indigo: '#5e5ce6', pink: '#ff375f', white: '#f5f5f7', grey: '#8e8e93' } };
})();
(function () {
// Zyvor Device Agent: SoC package pinout. Bus traces leave the pins as live square waves
// (I2C, SPI, UART, CAN, USB, GPIO), each drawn with its own signalling shape.
var C = Z.c, cx = 352, cy = 296, H = 80;
var d = Z.el('defs', {});
d.innerHTML = '<filter id="dagl" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
  '<filter id="dasf" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>' +
  '<linearGradient id="dapkg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2638"/><stop offset="1" stop-color="#0a0f19"/></linearGradient>' +
  '<radialGradient id="dadie"><stop offset="0" stop-color="#64d2ff" stop-opacity=".9"/><stop offset=".6" stop-color="#0071e3" stop-opacity=".5"/><stop offset="1" stop-color="#0071e3" stop-opacity=".15"/></radialGradient>' +
  '<radialGradient id="dahalo"><stop offset="0" stop-color="#2997ff" stop-opacity=".35"/><stop offset="1" stop-color="#2997ff" stop-opacity="0"/></radialGradient>';

Z.el('circle', { cx: cx, cy: cy, r: 230, fill: 'url(#dahalo)' });
// faint PCB traces texture
for (var k = 0; k < 26; k++) {
  var x = 110 + Z.rnd() * 540, y = 40 + Z.rnd() * 550, L1 = 30 + Z.rnd() * 70, L2 = 20 + Z.rnd() * 50, s = Z.rnd() < .5 ? 1 : -1;
  if (Math.abs(x - cx) < 140 && Math.abs(y - cy) < 140) continue;
  Z.el('path', { d: 'M' + x.toFixed(0) + ',' + y.toFixed(0) + ' h' + L1.toFixed(0) + ' l' + (s * 14) + ',' + 14 + ' v' + L2.toFixed(0), fill: 'none', stroke: 'rgba(100,170,255,.10)', 'stroke-width': 1.4 });
  Z.el('circle', { cx: x, cy: y, r: 2.4, fill: 'none', stroke: 'rgba(100,170,255,.18)' });
}

// square-wave along a local x axis; returns path d
function waveD(len, bits, amp, bw, off) {
  var lvl = bits.charAt(0) === '1', dd = 'M0,' + (lvl ? -amp : amp) + off;
  var x = 0, out = 'M0,' + ((lvl ? -amp : amp) + off);
  for (var i = 0; i * bw < len; i++) {
    var b = bits.charAt(i % bits.length) === '1';
    if (b !== lvl) { out += ' V' + ((b ? -amp : amp) + off); lvl = b; }
    x = Math.min(len, (i + 1) * bw); out += ' H' + x;
  }
  return out;
}
function bus(x0, y0, deg, len, kind, col) {
  var g = Z.g({ transform: 'translate(' + x0 + ',' + y0 + ') rotate(' + deg + ')' });
  Z.el('line', { x1: 0, y1: 0, x2: len, y2: 0, stroke: 'rgba(120,185,255,.22)', 'stroke-width': 1 }, g);
  var start = 16, wl = len - start - 10, w = Z.g({ transform: 'translate(' + start + ',0)' });
  g.appendChild(w);
  var lines = [];
  if (kind === 'i2c') { lines = [['10101010101010101010', 4, 6, -7], ['11001110001101100011', 4, 12, 7]]; }
  if (kind === 'spi') { lines = [['10101010101010101010', 5, 6, 0]]; }
  if (kind === 'uart') { lines = [['1110100110111011010011', 5, 9, 0]]; }
  if (kind === 'can') { lines = [['1101001110010110', 5, 10, -4], ['0010110001101001', 5, 10, 4]]; }
  if (kind === 'usb') { lines = [['10110010011010110', 4, 8, -5], ['01001101100101001', 4, 8, 5]]; }
  if (kind === 'gpio') { lines = [['0011111000', 6, 14, 0]]; }
  lines.forEach(function (ln, n) {
    Z.el('path', { d: waveD(wl, ln[0], ln[1], ln[2], ln[3]), fill: 'none', stroke: col, 'stroke-width': 1.9, opacity: n ? .6 : 1, 'stroke-linejoin': 'miter', filter: 'url(#dagl)' }, w);
  });
  Z.el('circle', { cx: len, cy: 0, r: 3.2, fill: '#fff', filter: 'url(#dagl)' }, g);
}

// package
var PK = H + 16, NP = 9, pitch = (2 * H - 28) / (NP - 1);
Z.el('rect', { x: cx - PK - 6, y: cy - PK - 6, width: 2 * PK + 12, height: 2 * PK + 12, rx: 14, fill: C.signal, opacity: .12, filter: 'url(#dasf)' });
// pins
var pins = { t: [], b: [], l: [], r: [] };
for (var i = 0; i < NP; i++) {
  var o = -H + 14 + i * pitch;
  pins.t.push([cx + o, cy - PK]); pins.b.push([cx + o, cy + PK]); pins.l.push([cx - PK, cy + o]); pins.r.push([cx + PK, cy + o]);
  Z.el('rect', { x: cx + o - 3.5, y: cy - PK - 12, width: 7, height: 14, rx: 1.5, fill: '#9fb6d4', opacity: .8 });
  Z.el('rect', { x: cx + o - 3.5, y: cy + PK - 2, width: 7, height: 14, rx: 1.5, fill: '#9fb6d4', opacity: .8 });
  Z.el('rect', { x: cx - PK - 12, y: cy + o - 3.5, width: 14, height: 7, rx: 1.5, fill: '#9fb6d4', opacity: .8 });
  Z.el('rect', { x: cx + PK - 2, y: cy + o - 3.5, width: 14, height: 7, rx: 1.5, fill: '#9fb6d4', opacity: .8 });
}
Z.el('rect', { x: cx - PK, y: cy - PK, width: 2 * PK, height: 2 * PK, rx: 10, fill: 'url(#dapkg)', stroke: 'rgba(160,200,255,.4)', 'stroke-width': 1.2 });
Z.el('rect', { x: cx - PK + 8, y: cy - PK + 8, width: 2 * PK - 16, height: 2 * PK - 16, rx: 6, fill: 'none', stroke: 'rgba(160,200,255,.12)' });
Z.el('circle', { cx: cx - PK + 18, cy: cy - PK + 18, r: 4, fill: 'rgba(160,200,255,.35)' });
// die
var DH = 46;
Z.el('rect', { x: cx - DH, y: cy - DH, width: 2 * DH, height: 2 * DH, rx: 4, fill: 'url(#dadie)', opacity: .55 });
for (var gx = 0; gx < 8; gx++) for (var gy = 0; gy < 8; gy++) {
  var lit = Z.rnd() < .22;
  Z.el('rect', { x: cx - DH + 5 + gx * 10.7, y: cy - DH + 5 + gy * 10.7, width: 8, height: 8, rx: 1, fill: lit ? '#bfe9ff' : 'rgba(10,20,40,.55)', opacity: lit ? .85 : 1 });
}
Z.el('rect', { x: cx - DH, y: cy - DH, width: 2 * DH, height: 2 * DH, rx: 4, fill: 'none', stroke: C.cyan, 'stroke-width': 1.6, filter: 'url(#dagl)' });

// stub traces with vias on unused pins
var used = { r: [2, 4, 6], t: [3], b: [6], l: [4] }, dirs = { t: [0, -1], b: [0, 1], l: [-1, 0], r: [1, 0] };
['t', 'b', 'l', 'r'].forEach(function (sd) {
  pins[sd].forEach(function (p, i) {
    if (used[sd].indexOf(i) >= 0) return;
    var dv = dirs[sd], L = 22 + Z.rnd() * 26, x0 = p[0] + dv[0] * 12, y0 = p[1] + dv[1] * 12;
    Z.el('path', { d: 'M' + x0.toFixed(1) + ',' + y0.toFixed(1) + ' l' + (dv[0] * L).toFixed(1) + ',' + (dv[1] * L).toFixed(1), stroke: 'rgba(120,185,255,.22)', 'stroke-width': 1.2 });
    Z.el('circle', { cx: x0 + dv[0] * L, cy: y0 + dv[1] * L, r: 2.6, fill: 'rgba(6,10,18,.9)', stroke: 'rgba(120,185,255,.4)' });
  });
});
// buses
var E = 12, RL = 132;
bus(pins.r[2][0] + E, pins.r[2][1], 0, RL, 'i2c', C.cyan);
bus(pins.r[4][0] + E, pins.r[4][1], 0, RL, 'spi', C.signal);
bus(pins.r[6][0] + E, pins.r[6][1], 0, RL, 'uart', C.teal);
bus(pins.t[3][0], pins.t[3][1] - E, -90, 128, 'can', C.violet);
bus(pins.b[6][0], pins.b[6][1] + E, 90, 118, 'usb', C.cyan);
bus(pins.l[4][0] - E, pins.l[4][1], 180, 104, 'gpio', C.green);

function tag(x, y, name) { Z.label(x, y, '<b>' + name + '</b>', 'box'); }
var RX = pins.r[0][0] + E + RL;
tag(RX + 36, pins.r[2][1], 'I2C');
tag(RX + 36, pins.r[4][1], 'SPI');
tag(RX + 40, pins.r[6][1], 'UART');
tag(pins.t[3][0] + 46, pins.t[3][1] - E - 128, 'CAN');
tag(pins.b[6][0] + 44, pins.b[6][1] + E + 118, 'USB');
tag(pins.l[4][0] - E - 104, pins.l[4][1] - 32, 'GPIO');
Z.label(cx - 112, cy + PK + 84, '<b>device-agent</b><span>discover the box</span>');
Z.label(cx + 210, 56, '&rarr; Nodra &middot; Fleet', 'chip');
})();
</script>
</body>
</html>
